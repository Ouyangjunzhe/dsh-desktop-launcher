name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 插件仅在 Windows 上工作，但测试套件本身是跨平台的：
    # 平台守卫、围栏、输入校验都不需要真实 Windows。
    # 两个平台都跑，才能验证「非 Windows 安全降级」这条路径。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: npm test
